name: e2e

# The whole end-to-end suite, after every merge to main. It runs beside the
# Vercel production deployment, never in front of it: a failure here means
# fix forward, and nothing waits for it. Only the newest commit on main is
# tested (an older run in progress is cancelled). Each run calls the paid
# model for several suites and writes to the live Supabase project; the
# *_LIVE switches stay off. Its global-teardown also clears the rows that
# pull request runs (e2e-changed.yml, which keep theirs) left behind.
#
# Pull requests run only the tests they change (e2e-changed.yml). Run this
# by hand from the Actions tab (workflow_dispatch) to test another branch.
#
# Actions are pinned to commit SHAs and `.env.local` is written right before
# the tests. No dependency cache (a pull_request_target run could poison a
# cache this job would restore) and no uploaded report (on a public
# repository an artifact is readable by anyone and never masked).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      E2E_BANK: "1"
      E2E_CANVAS: "1"
      E2E_HARNESS: "1"
      E2E_OPERATOR: "1"
      E2E_PRISM: "1"
      E2E_SWITCHBOARD: "1"
    steps:
      - name: Stop early when the E2E_ENV secret is missing
        env:
          E2E_ENV: ${{ secrets.E2E_ENV }}
        run: |
          if [ -z "$E2E_ENV" ]; then
            echo "::error::Set the E2E_ENV secret (the app's .env.local) to run the e2e suite."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Write .env.local from the E2E_ENV secret and mask its values
        env:
          E2E_ENV: ${{ secrets.E2E_ENV }}
        run: |
          set -euo pipefail
          printf '%s\n' "$E2E_ENV" > .env.local
          node -e '
            const { parseEnv } = require("node:util");
            const values = parseEnv(require("node:fs").readFileSync(".env.local", "utf8"));
            for (const value of Object.values(values))
              for (const line of value.split("\n"))
                if (line.trim().length >= 6) process.stdout.write(`::add-mask::${line}\n`);
          '
      - run: pnpm test:e2e

name: bank-growth-guard

# Fails a growth pull request (the Tidewater Bank demo's self-improvement
# loop, docs/adr/0024) that touches a path outside the bank demo.
#
# `pull_request_target` runs this workflow and the guard script from the
# default branch, so a growth pull request cannot edit its own guard; nothing from
# the pull request is checked out or executed.
#
# It runs on EVERY pull request and decides by itself whether one is a growth
# pull request (scripts/growth-pr.sh, shared with e2e-changed.yml): the
# `bank:growth` label, the routine's `bank-growth/` branch, or an issue the
# pull request closes (`Closes #n`) that carries `bank:growth`. The last is a
# fact the routine cannot take back: the bank labels the issue, not the
# routine. A pull request that only mentions a growth issue is not one.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled, edited]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: bank-growth-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    name: bank:growth stays in the bank
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The default branch's newest commit (what pull_request_target runs), never
      # the pull request: a pull request opened before a script landed still
      # gets it.
      - name: Check out the default branch (never the pull request)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            scripts/bank-growth-guard.mjs
            scripts/growth-pr.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Is this a growth pull request?
        id: growth
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: bash scripts/growth-pr.sh
      - name: List the files the pull request changes
        if: steps.growth.outputs.growth == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" --jq '.[] | {filename, status, previous_filename}' | jq -s '.' > "$RUNNER_TEMP/files.json"
      - name: Every file is inside the allowlist
        if: steps.growth.outputs.growth == 'true'
        run: node scripts/bank-growth-guard.mjs "$RUNNER_TEMP/files.json"

allowBuilds:
  '@swc/core': true
  cbor-extract: false
  esbuild: true
  sharp: false
  tesseract.js: false
  unrs-resolver: false

# Patched versions of transitive dependencies (pnpm audit --prod). Drop an
# entry once every parent depends on a patched version itself.
overrides:
  'undici@>=7 <7.30.1': ^7.30.1
  'zod@>=4 <4.6.6': ^4.6.6
  'minimatch@>=9 <11.0.1': ^11.0.1

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../templates/base.css">
<style>

.vc { position:relative; width:6.75in; height:4.25in; border-radius:.22in; overflow:hidden; font:9pt "DejaVu Sans",sans-serif; color:#1d1d1d;
  background: repeating-linear-gradient(45deg, rgba(120,80,150,.05) 0 6px, transparent 6px 12px), linear-gradient(180deg,#fbf7ff,#efe7f6); }
.vc .top { background:#5b2c83; color:#fff; padding:.14in .28in; }
.vc .top b { font:700 13pt "DejaVu Sans",sans-serif; letter-spacing:.04em; display:block; }
.vc .top span { font-size:7.5pt; letter-spacing:.08em; }
.vc .ph { position:absolute; left:.3in; top:1.05in; width:1.4in; height:1.75in; border:2px solid #fff; box-shadow:0 0 0 1px #b9a6c9; }
.vc .dat { position:absolute; left:1.95in; top:1.0in; right:.3in; line-height:1.3; }
.vc .lb { font-size:6.5pt; color:#6a4c84; text-transform:uppercase; letter-spacing:.06em; margin-top:5px; }
.vc .vl { font:700 10.5pt "DejaVu Sans",sans-serif; }
.vc .g2 { display:grid; grid-template-columns:1fr 1fr; column-gap:12px; }
.vc .dist { position:absolute; right:.3in; top:.98in; border:2px solid #5b2c83; color:#5b2c83; font:700 8pt "DejaVu Sans",sans-serif; padding:3px 8px; border-radius:3px; }
.vc .bar { position:absolute; left:.3in; bottom:.42in; width:2.2in; height:.32in; background:repeating-linear-gradient(90deg,#222 0 2px,transparent 2px 4px,#222 4px 5px,transparent 5px 8px); }

.page.card { padding:0; background:transparent; border-radius:.05in; } .page.card .vc, .page.card .dlc { border-radius:.05in; }
</style>
</head>
<body>
<section class="page card">
<div class="vc">
  <div class="top"><b>ELECTOR'S IDENTIFICATION CARD</b><span>CAYMAN ISLANDS · ELECTIONS OFFICE</span></div>
  <div class="ph"><svg viewBox="0 0 100 125" width="100%" height="100%" preserveAspectRatio="xMidYMid slice"><rect width="100" height="125" fill="#ddd3e6"/><circle cx="50" cy="48" r="22" fill="#8f7f9b"/><path d="M8 125c2-30 20-44 42-44s40 14 42 44z" fill="#8f7f9b"/></svg></div>
  <div class="dist">SAVANNAH</div>
  <div class="dat">
    <div class="lb">Name</div><div class="vl">BUSH, LOURDES PATRICIA</div>
    <div class="g2">
      <div><div class="lb">Date of birth</div><div class="vl">21 JUN 1969</div></div>
      <div><div class="lb">Sex</div><div class="vl">F</div></div>
      <div><div class="lb">Elector no.</div><div class="vl">SAV-004418</div></div>
      <div><div class="lb">Electoral district</div><div class="vl">Savannah</div></div>
      <div><div class="lb">Issued</div><div class="vl">14 FEB 2023</div></div>
      <div><div class="lb">Valid until</div><div class="vl">13 FEB 2033</div></div>
    </div>
  </div>
  <div class="bar"></div>
</div>
<div class="synthetic-note">SPECIMEN · synthetic demo document · not a real card design</div>
</section>
</body>
</html>
